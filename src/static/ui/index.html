<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RS-A · 俯瞰世界</title>
<style>
  :root { --bg:#0f1115; --panel:#161a22; --card:#1c212c; --line:#2a3140;
          --txt:#e8ebf0; --dim:#9aa3b2; --acc:#4f7dd9; --ok:#4caf7d; --warn:#d9a441; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--txt);
         font-family:"Segoe UI","Microsoft YaHei",sans-serif; height:100vh;
         display:flex; flex-direction:column; }
  header { display:flex; align-items:center; gap:14px; padding:10px 18px;
           background:var(--panel); border-bottom:1px solid var(--line); }
  header .logo { font-size:18px; font-weight:700; }
  header .logo span { color:var(--acc); }
  .pills { display:flex; gap:8px; margin-left:auto; align-items:center; }
  .pill { font-size:12px; padding:3px 10px; border-radius:10px;
          background:var(--card); border:1px solid var(--line); color:var(--dim); }
  .pill.ok { color:var(--ok); border-color:var(--ok); }
  .pill.bad { color:var(--warn); border-color:var(--warn); }
  .switch { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--dim);
            cursor:pointer; user-select:none; }
  .switch .knob { width:34px; height:18px; border-radius:9px; background:var(--line);
                  position:relative; transition:.2s; }
  .switch .knob::after { content:""; position:absolute; width:14px; height:14px;
          border-radius:50%; background:#fff; top:2px; left:2px; transition:.2s; }
  .switch.on .knob { background:var(--acc); }
  .switch.on .knob::after { left:18px; }
  #setup { display:none; padding:14px 18px; background:var(--panel);
           border-bottom:1px solid var(--line); }
  #setup.show { display:flex; gap:14px; flex-wrap:wrap; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px;
          padding:14px; flex:1; min-width:300px; }
  .card h3 { font-size:13px; color:var(--dim); margin-bottom:10px; }
  .card .done-tip { color:var(--ok); font-size:13px; }
  input[type=text],input[type=password],select,textarea {
    width:100%; background:#10141b; color:var(--txt); border:1px solid var(--line);
    border-radius:6px; padding:8px 10px; font-size:13px; margin-bottom:8px; }
  textarea { resize:vertical; font-family:Consolas,monospace; }
  button { background:var(--acc); color:#fff; border:none; border-radius:6px;
           padding:8px 16px; font-size:13px; cursor:pointer; }
  button:disabled { opacity:.45; cursor:default; }
  button.ghost { background:transparent; border:1px solid var(--line); color:var(--dim); }
  #chat { flex:1; overflow-y:auto; padding:18px; display:flex;
          flex-direction:column; gap:12px; }
  .msg { max-width:78%; padding:10px 14px; border-radius:12px; font-size:14px;
         line-height:1.6; white-space:pre-wrap; word-break:break-word; }
  .msg.user { align-self:flex-end; background:#2b3a5e; }
  .msg.bot  { align-self:flex-start; background:var(--card);
              border:1px solid var(--line); }
  .msg .stage { color:var(--dim); font-size:12.5px; }
  .msg img { max-width:100%; border-radius:8px; margin-top:8px; display:block; }
  .msg .cap { color:var(--dim); font-size:12px; margin-top:6px; }
  .msg .err { color:#e07a6a; }
  .msg .sug { color:var(--warn); font-size:12.5px; }
  .msg .q { color:var(--acc); }
  #bar { display:flex; gap:10px; padding:12px 18px; background:var(--panel);
         border-top:1px solid var(--line); }
  #bar textarea { flex:1; height:44px; margin:0; }
  #bar select { width:110px; margin:0; }
  #hint { text-align:center; color:var(--dim); font-size:12px; padding:4px; }
</style>
</head>
<body>
<header>
  <div class="logo">🛰 <span>RS-A</span> · 俯瞰世界</div>
  <div class="pills">
    <div class="pill" id="p-srv">服务…</div>
    <div class="pill" id="p-llm">LLM…</div>
    <div class="pill" id="p-cred">凭证…</div>
    <div class="switch" id="think-sw" title="分析管线思考模式 (OFF 秒级 / ON 深思)">
      思考<div class="knob"></div>
    </div>
    <button class="ghost" id="btn-setup" style="padding:4px 10px">设置</button>
  </div>
</header>

<div id="setup">
  <div class="card" id="c-llm">
    <h3>① AI 模型 (必填)</h3>
    <select id="llm-provider">
      <option value="minimax">MiniMax (推荐)</option>
      <option value="deepseek">DeepSeek</option>
      <option value="zhipu">智谱 GLM</option>
      <option value="qwen">阿里通义</option>
    </select>
    <input type="password" id="llm-key" placeholder="粘贴 API Key (如 eyJhbG... 或 sk-...)">
    <button onclick="saveLLM()">保存并启用</button>
    <span class="done-tip" id="llm-tip"></span>
  </div>
  <div class="card" id="c-cred">
    <h3>② GEE 卫星数据凭证 (必填)</h3>
    <input type="text" id="uid" placeholder="起一个用户名 (英文, 如 rs-a-user)">
    <textarea id="sa-json" rows="5" placeholder='粘贴 Google Earth Engine Service Account JSON (含 private_key 的整段)'></textarea>
    <button onclick="bindCred()">绑定凭证</button>
    <span class="done-tip" id="cred-tip"></span>
  </div>
</div>

<div id="chat">
  <div class="msg bot" id="welcome">你好，我是 RS-A 🛰<br>
    用一句中文告诉我你想看哪里的地表，例如：<br>
    <b>「分析南京市江宁区 2024 年夏季的植被状况」</b><br>
    我会在云端处理卫星影像并给你一张带图例的分类图。</div>
</div>
<div id="hint"></div>
<div id="bar">
  <textarea id="input" placeholder="描述你的遥感任务… (Enter 发送)"></textarea>
  <select id="quality">
    <option value="standard">标准 (&lt;1MB)</option>
    <option value="high">高清 (1-10MB)</option>
    <option value="max">超清 (&gt;30MB)</option>
  </select>
  <button id="send" onclick="onSend()">发送</button>
</div>

<script>
"use strict";
const $ = id => document.getElementById(id);
const auth = {
  get uid(){ return localStorage.getItem("rs_uid") || ""; },
  get tok(){ return localStorage.getItem("rs_tok") || ""; },
  set(uid, tok){ localStorage.setItem("rs_uid", uid);
                 localStorage.setItem("rs_tok", tok); },
  get ok(){ return !!(this.uid && this.tok); }
};
const H = () => ({ "Authorization": "Bearer " + auth.tok });
let pendingClarify = null;   // {task_id} 等待回答的任务
let lastSeq = 0;             // 已收到的最大事件 seq (澄清续跑/SSE 断线续传用)

// ---------- 状态轮询 ----------
async function pollStatus(){
  try{
    const h = await (await fetch("/health")).json();
    $("p-srv").textContent = "服务 ✓"; $("p-srv").className = "pill ok";
    const llmOk = h.llm === "configured";
    $("p-llm").textContent = llmOk ? "LLM ✓" : "LLM 未配";
    $("p-llm").className = "pill " + (llmOk ? "ok" : "bad");
    if (llmOk) $("llm-tip").textContent = "✓ 已配置";
  }catch(e){ $("p-srv").textContent = "服务 ×"; $("p-srv").className="pill bad"; }
  if (auth.ok){
    try{
      const c = await (await fetch(
        "/credentials/status?user_id=" + encodeURIComponent(auth.uid),
        { headers: H() })).json();
      $("p-cred").textContent = c.bound ? "凭证 ✓" : "凭证 未绑";
      $("p-cred").className = "pill " + (c.bound ? "ok" : "bad");
      if (c.bound) $("cred-tip").textContent = "✓ 已绑定" +
        (c.email ? " (" + c.email + ")" : "");
    }catch(e){ $("p-cred").textContent = "凭证 ×"; $("p-cred").className="pill bad"; }
  } else { $("p-cred").textContent = "凭证 未绑"; $("p-cred").className = "pill bad"; }
}
async function pollThinking(){
  try{
    const t = await (await fetch("/thinking")).json();
    $("think-sw").classList.toggle("on", t.mode === "ON");
  }catch(e){}
}
setInterval(pollStatus, 15000); setInterval(pollThinking, 20000);
pollStatus(); pollThinking();

// ---------- 配置向导 ----------
function showSetup(open){
  $("setup").classList.toggle("show", open);
}
$("btn-setup").onclick = () =>
  showSetup(!$("setup").classList.contains("show"));
if (!auth.ok) showSetup(true);   // 首次使用直接展开向导

async function saveLLM(){
  const key = $("llm-key").value.trim();
  if (!key) return alert("请粘贴 API Key");
  const r = await fetch("/llm-config", { method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ provider: $("llm-provider").value,
                           api_key: key }) });
  if (r.ok){ $("llm-tip").textContent = "✓ 已启用"; pollStatus(); }
  else alert("保存失败: " + (await r.text()));
}

async function bindCred(){
  const uid = $("uid").value.trim(), sa = $("sa-json").value.trim();
  if (!uid || !sa) return alert("用户名与 Service Account JSON 都要填");
  let cred; try { cred = JSON.parse(sa); } catch(e){ return alert("JSON 解析失败: " + e); }
  const r = await fetch("/credentials", { method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ user_id: uid, credentials: cred }) });
  const d = await r.json();
  if (r.ok && d.access_token){
    auth.set(uid, d.access_token);
    $("cred-tip").textContent = "✓ 已绑定 (令牌已保存, 仅显示一次)";
    pollStatus(); showSetup(false);
  } else alert("绑定失败: " + JSON.stringify(d.detail || d));
}

// ---------- 思考开关 ----------
$("think-sw").onclick = async () => {
  if (!auth.ok) return alert("请先绑定凭证");
  const on = !$("think-sw").classList.contains("on");
  await fetch("/thinking", { method:"POST", headers:{...H(),
    "Content-Type":"application/json" },
    body: JSON.stringify({ user_id: auth.uid, mode: on ? "ON" : "OFF" }) });
  pollThinking();
};

// ---------- 聊天 ----------
function addMsg(cls, text){
  const el = document.createElement("div");
  el.className = "msg " + cls; el.textContent = text;
  $("chat").appendChild(el); $("chat").scrollTop = 1e9;
  return el;
}
function setStage(el, line){
  let s = el.querySelector(".stage");
  if (!s){ s = document.createElement("div"); s.className = "stage";
           el.appendChild(s); }
  s.textContent = line; $("chat").scrollTop = 1e9;
}

async function onSend(){
  const text = $("input").value.trim();
  if (!text || !auth.ok){
    if (!auth.ok){ alert("请先在「设置」里完成 ①模型 ②凭证 绑定"); showSetup(true); }
    return;
  }
  $("input").value = "";
  addMsg("user", text);
  const bot = addMsg("bot", "已提交, 排队中…");
  setBusy(true);
  try{
    let tid;
    if (pendingClarify){                       // 澄清续跑
      const r = await fetch("/tasks/" + pendingClarify + "/answer", {
        method:"POST", headers:{...H(), "Content-Type":"application/json"},
        body: JSON.stringify({ user_id: auth.uid, answer: text }) });
      tid = pendingClarify; pendingClarify = null;
      if (!r.ok) throw new Error("续跑失败 " + r.status);
    } else {                                  // 新任务
      const r = await fetch("/analyze", { method:"POST",
        headers:{...H(), "Content-Type":"application/json"},
        body: JSON.stringify({ user_id: auth.uid, user_input: text,
                               quality: $("quality").value }) });
      if (!r.ok) throw new Error("提交失败 " + r.status + ": "
                                 + (await r.text()).slice(0, 200));
      tid = (await r.json()).task_id;
    }
    await streamTask(tid, bot);
  }catch(e){
    bot.textContent = ""; const err = document.createElement("div");
    err.className = "err"; err.textContent = "⚠ " + e.message;
    bot.appendChild(err);
  }finally{ setBusy(false); }
}
$("input").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); onSend(); }
});
function setBusy(b){ $("send").disabled = b; $("input").disabled = b;
  $("hint").textContent = b ? "云端处理中… 分类图通常 1-2 分钟, 超清挡约 6 分钟" : "";
  if (!b) $("input").focus();
}

// ---------- SSE (fetch 流解析, EventSource 无法带 Bearer) ----------
// after=lastSeq: 续跑/重连只收新事件 —— 从 0 重放会让旧的 need_clarify
// 终态事件立即触发 close, 卡片冻结成假终态 (澄清死循环卡死事故, obsidian 39)
async function streamTask(tid, bot){
  try{
    const resp = await fetch("/tasks/" + tid + "/events?after=" + lastSeq,
                             { headers: H() });
    const reader = resp.body.getReader(), dec = new TextDecoder();
    let buf = "", closed = false;
    while (!closed){
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let idx;
      while ((idx = buf.indexOf("\n\n")) >= 0){
        const frame = buf.slice(0, idx); buf = buf.slice(idx + 2);
        const evLine = frame.split("\n").find(l => l.startsWith("event:"));
        const dLine = frame.split("\n").find(l => l.startsWith("data:"));
        if (!dLine) continue;
        const ev = evLine ? evLine.slice(6).trim() : "message";
        if (ev === "close"){ closed = true; break; }
        try{
          const d = JSON.parse(dLine.slice(5));
          if (d.seq > lastSeq) lastSeq = d.seq;
          if (d.detail) setStage(bot, "· " + d.detail);
        }catch(e){}
      }
    }
  }catch(e){
    // 进度流中断 (网络/服务闪断): 不静默 —— 提示用户并以状态端点对账
    setStage(bot, "· 进度连接中断, 正在核对任务结果…");
  }
  await renderTerminal(tid, bot);
}

async function renderTerminal(tid, bot){
  try{
    const t = await (await fetch("/tasks/" + tid, { headers: H() })).json();
    bot.textContent = ""; bot.querySelector(".stage")?.remove();
  if (t.status === "need_clarify"){
    const q = document.createElement("div"); q.className = "q";
    q.textContent = "🤔 " + (t.question || "需要补充信息");
    bot.appendChild(q);
    const tip = document.createElement("div"); tip.className = "cap";
    tip.textContent = "直接在下方输入回答即可继续";
    bot.appendChild(tip);
    pendingClarify = tid;
  } else if (t.status === "failed"){
    const e = t.error || {};
    const err = document.createElement("div"); err.className = "err";
    err.textContent = "⚠ " + (e.message || "本次分析没有成功");
    bot.appendChild(err);
    if (e.suggestion){
      const s = document.createElement("div"); s.className = "sug";
      s.textContent = "💡 " + e.suggestion; bot.appendChild(s); }
  } else if (t.status === "done"){
    // 结果端点要 Bearer, <img src> 带不了 —— blob fetch 后 objectURL 展示
    const rr = await fetch("/tasks/" + tid + "/result?_t=" + Date.now(),
                           { headers: H() });
    if (!rr.ok){
      const err = document.createElement("div"); err.className = "err";
      err.textContent = "⚠ 结果图下载失败 (" + rr.status + ")";
      bot.appendChild(err);
    } else {
      const img = new Image();
      img.src = URL.createObjectURL(await rr.blob());
      img.onload = () => $("chat").scrollTop = 1e9;
      bot.appendChild(img);
    }
    if (t.caption){
      const c = document.createElement("div"); c.className = "cap";
      c.textContent = t.caption; bot.appendChild(c); }
  } else {
    bot.textContent = "任务状态: " + t.status + " (" + (t.phase_text||"") + ")";
  }
  $("chat").scrollTop = 1e9;
  }catch(e){
    // 状态对账也失败 (服务不可达): 给出人话, 不留永转的假进度
    bot.querySelector(".stage")?.remove();
    const err = document.createElement("div"); err.className = "err";
    err.textContent = "⚠ 无法获取任务结果 (服务可能已停止)。请确认 RS-A 控制台窗口仍在运行后重试。";
    bot.appendChild(err);
  }
}
</script>
</body>
</html>
